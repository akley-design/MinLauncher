# MinLauncher cargo configuration.
#
# The toolchain (including the host triple) is pinned in rust-toolchain.toml;
# the target triple follows the host, so it is not repeated here.

[build]
# The build directory stays on an ASCII-only path.
#
# The Windows resource compiler reads the .rc file through the ANSI code page,
# not UTF-8. This machine's home directory contains Cyrillic characters, so a
# path under it is lost before rc.exe reaches the icon or the manifest. Moving
# only the build directory is enough: ml-desktop stages both inside OUT_DIR.
#
# Under the GNU toolchain the Windows import library also had to be copied out
# of the Cargo registry; that copy is made only for windows-gnu. The MSVC
# linker finds the library by itself.
#
# Override this with CARGO_TARGET_DIR.
target-dir = "C:/Users/Public/minlaucher-target"

[term]
color = "always"

[profile.dev]
# Debug info is what makes link times explode, and the launcher is not the
# place where we profile.
debug = 1
