[package]
name = "ml-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tauri shell: IPC commands, application state and plugin wiring"

[lints]
workspace = true

[lib]
name = "ml_desktop"
# Only the library is built. The `staticlib` and the `cdylib` are what
# the mobile targets need, and this project has none: every release
# build paid for three copies of the same code — with the link time
# that goes with them — to produce two files nobody uses.
crate-type = ["rlib"]

[[bin]]
name = "minlaucher"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true
embed-resource.workspace = true

[dependencies]
ml-core.workspace = true
ml-storage.workspace = true
ml-minecraft.workspace = true
ml-launch.workspace = true
ml-bench.workspace = true
tauri.workspace = true
tauri-plugin-store.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
chrono.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The jar of a mod is a zip file, and the test that says "a mod the loader
# would refuse is not installed" has to build one.
zip.workspace = true
# The `test` feature brings the mock runtime of Tauri: it lets the tests
# build an application without a window and without a display, so that a
# command that needs the handle of the application can be called for real.
tauri = { workspace = true, features = ["test"] }
