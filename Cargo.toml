[workspace]
resolver = "3"
members = [
    "crates/ml-core",
    "crates/ml-storage",
    "crates/ml-minecraft",
    "crates/ml-launch",
    "crates/ml-bench",
    "crates/ml-desktop",
]

[workspace.package]
version = "0.1.1-beta"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["MinLauncher Team"]
repository = "https://github.com/akley-design/MinLauncher"
description = "Fast Minecraft launcher with an optimized Rust core and an optimized game"

[workspace.dependencies]
# --- internal ---
ml-core = { path = "crates/ml-core", version = "0.1.1-beta" }
ml-storage = { path = "crates/ml-storage", version = "0.1.1-beta" }
ml-minecraft = { path = "crates/ml-minecraft", version = "0.1.1-beta" }
ml-launch = { path = "crates/ml-launch", version = "0.1.1-beta" }
ml-bench = { path = "crates/ml-bench", version = "0.1.1-beta" }

# --- errors & logging ---
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# --- async ---
tokio = { version = "1.53.3", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "process",
    "sync",
    "time",
] }
futures = "0.3"

# --- serialization ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# --- http ---
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "json", "stream", "query"] }
url = "2"
sha1 = "0.10"
sha2 = "0.11"
md-5 = "0.10"
hex = "0.4"
aes-gcm = "0.10.3"
getrandom = "0.4.3"
pbkdf2 = "0.13.0"

# --- storage ---
rusqlite = { version = "0.40.2", features = [
    "bundled",
    "cache",
    "functions",
    "column_decltype",
] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"

# --- filesystem & compression ---
walkdir = "2.5.0"
fs2 = "0.4.3"
zip = "9.0.5"

# --- utilities ---
uuid = { version = "1.28.0", features = ["v4", "serde"] }
dirs = "7.0.0"
parking_lot = "0.12.5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# --- windows ---
winreg = "0.56.0"

# --- testing ---
tempfile = "3"
criterion = "0.8.2"

# --- tauri ---
tauri = { version = "2.12.4", features = ["tray-icon", "protocol-asset"] }
tauri-build = "2.7.3"
# Used by the build script of `ml-desktop` to embed the Windows manifest
# into every target of the crate — see the comment in
# `crates/ml-desktop/build.rs`.
embed-resource = "3.0.12"
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-deep-link = "2.4.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
# A Tauri command receives its arguments deserialised into owned values,
# so the arguments of a command are `String` and not `&str` even when the
# body of the command only reads them.
needless_pass_by_value = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The launcher itself must start fast: optimise the dependency graph for size,
# keep debug assertions out of release, but keep symbols in the test profile.
[profile.bench]
debug = true
