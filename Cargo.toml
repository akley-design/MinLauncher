[workspace]
resolver = "3"
members = [
    "crates/ml-core",
    "crates/ml-storage",
    "crates/ml-minecraft",
    "crates/ml-launch",
    "crates/ml-bench",
    "crates/ml-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["MinLauncher Team"]
repository = "https://github.com/minlaucher/minlaucher"
description = "Fast Minecraft launcher (TLauncher-compatible) with an optimized Rust core"

[workspace.dependencies]
# --- internal ---
ml-core = { path = "crates/ml-core", version = "0.1.0" }
ml-storage = { path = "crates/ml-storage", version = "0.1.0" }
ml-minecraft = { path = "crates/ml-minecraft", version = "0.1.0" }
ml-launch = { path = "crates/ml-launch", version = "0.1.0" }

# --- errors & logging ---
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# --- async ---
tokio = { version = "1.53.3", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "process",
    "sync",
    "time",
] }
futures = "0.3"
futures-util = "0.3.34"

# --- serialization ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# --- http ---
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "json", "stream"] }
url = "2"
bytes = "1"
sha1 = "0.10"
sha2 = "0.11"
hex = "0.4"

# --- storage ---
rusqlite = { version = "0.40.2", features = [
    "bundled",
    "cache",
    "functions",
    "column_decltype",
] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"

# --- filesystem & compression ---
tokio-util = { version = "0.7", features = ["io"] }
walkdir = "2.5.0"
rayon = "1.12.0"
zip = "9.0.5"
flate2 = "1"
zstd = "0.14.3"

# --- utilities ---
uuid = { version = "1.28.0", features = ["v4", "serde"] }
dirs = "7.0.0"
once_cell = "1.21.4"
parking_lot = "0.12.5"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
regex = "1"

# --- windows ---
winreg = "0.56.0"

# --- testing ---
tempfile = "3"
criterion = "0.8.2"

# --- tauri ---
tauri = { version = "2.12.4", features = ["tray-icon", "protocol-asset"] }
tauri-build = "2.7.3"
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The launcher itself must start fast: optimise the dependency graph for size,
# keep debug assertions out of release, but keep symbols in the test profile.
[profile.bench]
debug = true
