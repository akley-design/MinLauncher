[toolchain]
# The MSVC host toolchain is pinned deliberately.
#
# Build scripts and procedural macros are always compiled for the *host*, not
# for the `--target` triple, so the host needs the Windows 10/11 SDK (the
# `kernel32.lib` / `ucrt.lib` import libraries) plus the "Desktop development
# with C++" workload of Visual Studio.
#
# The SDK comes with Visual Studio, so there is nothing to install apart from
# Visual Studio itself. The paths to the compiler and to the SDK on this
# machine are in `docs/RELEASE.md`, §7.
#
# The GNU toolchain was used before this and it is still installed: it is
# self-contained and needs no SDK, which made it the right choice while the
# release build did not exist. `link.exe` of MSVC is Unicode-clean, so the
# workarounds that the Cyrillic home path needed are gone — the ones that are
# still needed (the directory of the build) are explained in `.cargo/config.toml`.
channel = "stable-x86_64-pc-windows-msvc"
components = ["rustfmt", "clippy"]
profile = "default"
