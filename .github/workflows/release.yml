# The release of MinLauncher.
#
# The tag is the version: `v0.1.0` publishes the version `0.1.0` that the
# project carries in `Cargo.toml` and in `tauri.conf.json`. The three
# numbers must agree — the updater compares the version of the running
# binary with the version of the manifest, and a mismatch would make every
# release look like a downgrade.
#
# The private key of the signature lives in the secrets of the repository
# and never in the repository itself. The public key is in
# `crates/ml-desktop/tauri.conf.json`.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, with or without the `v`"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: The installers
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # The build directory stays inside the project, on the path of the
      # runner, which is plain ASCII.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The MSVC host. The runner has the Windows SDK, and the GNU host
      # needs MSYS2 for the C compiler — MSVC needs neither.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check that the tag and the project agree on the version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          CONF=$(node -p "require('./crates/ml-desktop/tauri.conf.json').version")
          CARGO=$(cargo metadata --no-deps --format-version 1 --quiet | node -e "
            let s = '';
            process.stdin.on('data', (d) => (s += d)).on('end', () => {
              const m = JSON.parse(s);
              console.log(m.packages.find((p) => p.name === 'ml-desktop').version);
            });
          ")
          if [ "$CONF" != "$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "The tag is $TAG, but the version of tauri.conf.json is $CONF and the version of Cargo.toml is $CARGO."
            echo "They must be the same: the updater compares them with the version of the manifest."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check public Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo "Set the VITE_SUPABASE_URL repository variable."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Set the VITE_SUPABASE_ANON_KEY repository variable."; exit 1; }

      - name: Prepare Windows Authenticode signing
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw "WINDOWS_CERTIFICATE_PFX_BASE64 is required to publish a Windows release."
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when a signing certificate is configured."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "minlauncher-codesign.pfx"
          $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          try {
            $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $certificate = $importedCertificates |
            Where-Object { $_.HasPrivateKey -and ($_.EnhancedKeyUsageList | Where-Object { $_.ObjectId -eq $codeSigningOid }) } |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if (-not $certificate) {
            throw "The PFX has no certificate with a private key and code-signing usage."
          }
          if ($certificate.NotAfter -le (Get-Date)) {
            throw "The Windows signing certificate has expired."
          }

          $configPath = Join-Path $env:RUNNER_TEMP "tauri-windows-signing.json"
          $tauriConfig = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint } } }
          $json = ConvertTo-Json -InputObject $tauriConfig -Depth 5
          [System.IO.File]::WriteAllText($configPath, $json, [System.Text.UTF8Encoding]::new($false))
          "config_path=$configPath" >> $env:GITHUB_OUTPUT
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "enabled=true" >> $env:GITHUB_OUTPUT

      - name: Build the installers
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_CONFIG: ${{ steps.windows-signing.outputs.config_path }}
        run: npm run tauri:build -- --config "$TAURI_SIGNING_CONFIG"

      - name: Check that both installers are there
        run: |
          set -euo pipefail
          BUNDLE="$CARGO_TARGET_DIR/release/bundle"
          ls "$BUNDLE/nsis"/*.exe "$BUNDLE/msi"/*.msi
          # The signature of every installer: without it the updater
          # refuses to install the file, and that must break the release.
          ls "$BUNDLE/nsis"/*.exe.sig "$BUNDLE/msi"/*.msi.sig

      - name: Verify Windows Authenticode signatures
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          $bundle = Join-Path $env:CARGO_TARGET_DIR "release/bundle"
          $files = @(
            (Join-Path $env:CARGO_TARGET_DIR "release/minlaucher.exe")
            (Get-ChildItem -LiteralPath (Join-Path $bundle "nsis") -File -Filter "*.exe").FullName
            (Get-ChildItem -LiteralPath (Join-Path $bundle "msi") -File -Filter "*.msi").FullName
          )
          if ($files.Count -lt 3) {
            throw "Expected the launcher binary and both NSIS and MSI installers."
          }
          $signtoolPath = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtoolPath) {
            $signtoolPath = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtoolPath) {
            throw "signtool.exe was not found on the Windows runner."
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Signed release file not found: $file"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for $file`: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected Authenticode signer for $file"
            }
            & $signtoolPath verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for $file with exit code $LASTEXITCODE"
            }
            Write-Host "Verified Authenticode signature: $file"
          }

      - name: Build the manifest of the update
        run: |
          set -euo pipefail
          NOTES_FILE="release-notes/${{ steps.version.outputs.tag }}.md"
          test -s "$NOTES_FILE" || { echo "Release notes are missing: $NOTES_FILE"; exit 1; }
          node scripts/latest-json.mjs \
            --bundle-dir "$CARGO_TARGET_DIR/release/bundle" \
            --version "${{ steps.version.outputs.version }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}" \
            --notes "$(cat "$NOTES_FILE")" \
            --out "$RUNNER_TEMP/latest.json"

      - name: Publish the release
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE="$CARGO_TARGET_DIR/release/bundle"
          cp "$RUNNER_TEMP/latest.json" "$BUNDLE/latest.json"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --title "MinLauncher $TAG" --generate-notes
          gh release upload "$TAG" \
            "$BUNDLE/nsis"/*.exe \
            "$BUNDLE/nsis"/*.exe.sig \
            "$BUNDLE/msi"/*.msi \
            "$BUNDLE/msi"/*.msi.sig \
            "$BUNDLE/latest.json" \
            --clobber
