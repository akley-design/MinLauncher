# The Gradle configuration of the Java part of MinLauncher.

# Windows builds use an ASCII-only path when the project directory has
# non-ASCII characters. The build script chooses a normal layout on Linux.
#
# The JVM reads the class path of the test runner through the Windows
# ANSI code page, not through UTF-8. When the project lives under a
# path that contains non-ASCII characters — the home directory of this
# machine contains Cyrillic — the test runner cannot find the classes
# it was just given and dies with "ClassNotFoundException" for every
# test, while the build itself reports success.
#
# Relocating the *build* directory is enough: the sources are read by
# the compiler, which is UTF-8 clean. Override the Windows path with
# the `org.gradle.project.buildDir` command line property if needed.

# The Gradle daemon keeps a lot of memory, and this project is built by
# hand as often as by CI. A single worker is enough.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

# The version of the mod, shared by the agent and the mod.
modVersion=0.1.0

# The version of Minecraft the mod is built against.
#
# The game of this project is 26.3, but the Fabric toolchain has not
# caught up with it yet, and a mod that does not build is worse than no
# mod at all. The mod is therefore built against a version that the
# loader supports, and the launcher decides at run time which mod jar
# goes with which version of the game.
minecraftVersion=1.21.4
loomVersion=1.9-SNAPSHOT
loaderVersion=0.16.9
